name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag and version
        id: version
        shell: powershell
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION v$version."
          }
          $releaseNotes = "docs\releases\v$version.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            throw "Missing release notes: $releaseNotes"
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))
          .\scripts\Verify-Release.ps1 -Version $version

      - name: Build, test, and package
        shell: powershell
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = Resolve-Path "release\CodexConversationMigrator-Windows-v$version.zip"
          $sums = Resolve-Path 'release\SHA256SUMS.txt'
          $notes = Resolve-Path "docs\releases\v$version.md"
          gh release create $env:GITHUB_REF_NAME $zip.Path $sums.Path --verify-tag --notes-file $notes.Path --title "Codex Conversation Migrator $env:GITHUB_REF_NAME"
