name: Build and test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch verified cct dependency
        shell: powershell
        run: .\Get-Cct.ps1

      - name: Build, test, and package
        shell: powershell
        run: .\package.ps1 -Version 3.0.0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/test/
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CodexConversationMigrator-Windows-v3.0.0
          path: |
            release/CodexConversationMigrator-Windows-v3.0.0.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
