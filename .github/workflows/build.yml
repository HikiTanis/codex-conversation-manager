name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read and validate version
        id: version
        shell: powershell
        run: |
          $version = [IO.File]::ReadAllText('VERSION').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))
          .\scripts\Verify-Release.ps1 -Version $version

      - name: Build, test, and package
        shell: powershell
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/test/
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CodexConversationMigrator-Windows-v${{ steps.version.outputs.version }}
          path: |
            release/CodexConversationMigrator-Windows-v${{ steps.version.outputs.version }}.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
